@if (isLoading() && items().length === 0) {
  <p>Cargando...</p>
} @else if (hasError()) {
  <p>Error al cargar las propiedades</p>
} @else {
  <div class="grid">
    @for (item of items(); track item.id) {
      <div class="col-12 md:col-6 xl:col-4">
        <app-property-card [property]="item" />
      </div>
    }
  </div>

  @if (hasMore()) {
    <button class="load-more" (click)="loadMore()" [disabled]="isLoading()">
      {{ isLoading() ? 'Cargando...' : 'Ver 12 inmuebles más' }}
    </button>
  }
}

<button class="scroll-top" (click)="scrollToTop()">Ir arriba</button>
