<div class="hero-gallery">
  @if (images().length > 0) {
    <div class="hero-gallery__main-wrapper" (click)="open(images()[0])">
      <img class="hero-gallery__main" [src]="images()[0].Uri" alt="Imagen principal" />
      <div class="hero-gallery__counter">
        <img src="/icons/camera.svg" alt="" aria-hidden="true" />
        <span>{{ images().length }} fotos</span>
      </div>
    </div>
  }

  <div class="hero-gallery__thumbs">
    @for (img of images().slice(1, 5); track img.PkImagen) {
      <img class="hero-gallery__thumb" [src]="img.Uri" alt="Imagen {{ $index + 2 }}" (click)="open(img)" />
    }
  </div>
</div>

@if (activeImage()) {
  <div class="gallery-modal" (click)="close()">
    <button class="gallery-modal__nav gallery-modal__nav--prev" (click)="$event.stopPropagation(); prev()">
      <ng-icon name="matChevronLeft" />
    </button>
    <img class="gallery-modal__img" [src]="activeImage()!.Uri" alt="" (click)="$event.stopPropagation()" />
    <button class="gallery-modal__nav gallery-modal__nav--next" (click)="$event.stopPropagation(); next()">
      <ng-icon name="matChevronRight" />
    </button>
    <button class="gallery-modal__close" (click)="close()">
      <ng-icon name="matClose" />
    </button>
  </div>
}
